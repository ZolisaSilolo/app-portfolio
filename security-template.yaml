AWSTemplateFormatVersion: '2010-09-09'
Description: Security enhancements for existing portfolio API

Parameters:
  ExistingApiId:
    Type: String
    Description: Your existing API Gateway ID
    Default: ih7tek9ql6

  Environment:
    Type: String
    Default: prod
    Description: Environment name

Resources:
  # Usage Plan for rate limiting (FREE)
  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub "portfolio-security-${Environment}"
      Description: Rate limiting for portfolio API
      Throttle:
        RateLimit: 100    # requests per second
        BurstLimit: 200   # burst capacity
      Quota:
        Limit: 10000      # requests per day
        Period: DAY
      ApiStages:
        - ApiId: !Ref ExistingApiId
          Stage: !Ref Environment

  # API Key for monitoring (FREE)
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub "portfolio-key-${Environment}"
      Description: API key for portfolio monitoring
      Enabled: true

  # Link usage plan to API key (FREE)
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  UsagePlanId:
    Description: API Gateway Usage Plan ID
    Value: !Ref ApiUsagePlan

  ApiKeyId:
    Description: API Gateway Key ID
    Value: !Ref ApiKey
