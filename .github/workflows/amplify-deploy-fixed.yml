name: Deploy to Amplify

on:
  push:
    branches: [ new-react-client ]
  pull_request:
    branches: [ new-react-client ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      env:
        VITE_API_BASE_URL: https://ih7tek9ql6.execute-api.us-east-1.amazonaws.com/prod
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Create deployment package
      run: |
        cd dist
        zip -r ../deployment.zip .
        cd ..
        
    - name: Deploy to Amplify
      run: |
        APP_ID="d1qen9zpw73vjz"
        BRANCH_NAME="new-react-client"
        
        echo "🚀 Creating deployment for app: $APP_ID"
        
        # Create deployment
        DEPLOYMENT_ID=$(aws amplify create-deployment \
          --app-id $APP_ID \
          --branch-name $BRANCH_NAME \
          --query 'deploymentId' \
          --output text)
          
        echo "📦 Deployment created: $DEPLOYMENT_ID"
        
        # Upload build artifacts
        UPLOAD_URL=$(aws amplify create-deployment \
          --app-id $APP_ID \
          --branch-name $BRANCH_NAME \
          --query 'zipUploadUrl' \
          --output text)
          
        echo "📤 Uploading artifacts..."
        curl -T deployment.zip "$UPLOAD_URL"
        
        # Start deployment
        echo "🚀 Starting deployment..."
        aws amplify start-deployment \
          --app-id $APP_ID \
          --branch-name $BRANCH_NAME \
          --deployment-id $DEPLOYMENT_ID
          
        echo "✅ Deployment started successfully"
