name: Deploy to Amplify
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - run: npm ci && npm run build
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Deploy to Amplify
      run: |
        cd dist && zip -r ../build.zip .
        DEPLOYMENT=$(aws amplify create-deployment --app-id d1qen9zpw73vjz --branch-name main)
        UPLOAD_URL=$(echo $DEPLOYMENT | jq -r '.zipUploadUrl')
        curl -T build.zip "$UPLOAD_URL"
        aws amplify start-deployment --app-id d1qen9zpw73vjz --branch-name main --job-id $(echo $DEPLOYMENT | jq -r '.jobId')
