name: Deploy to AWS Amplify

on:
  push:
    branches: [ new-react-client ]
  pull_request:
    branches: [ new-react-client ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Type check
      run: npx tsc --noEmit
      
    - name: Build project
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        
    - name: Deploy to Amplify
      run: |
        echo "✅ Build successful - Amplify will auto-deploy from this push"
        echo "🚀 Changes will be live at your Amplify domain shortly"
