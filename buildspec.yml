version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - echo Installing dependencies...
      - npm install
  build:
    commands:
      - echo Build started on `date`
      - npm run build
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Uploading to S3...
      - aws s3 sync dist/ s3://$ARTIFACTS_BUCKET/builds/$(date +%Y%m%d-%H%M%S)/
artifacts:
  files:
    - '**/*'
  base-directory: dist
